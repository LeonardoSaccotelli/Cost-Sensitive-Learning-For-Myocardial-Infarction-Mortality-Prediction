[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "myocardial_infarction_mortality"
version = "0.0.1"
description = "Cost-Sensitive-Learning-For-Myocardial-Infarction-Mortality-Prediction"
authors = [
  { name = "Leonardo Saccotelli" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["myocardial_infarction_mortality"]
include = ["pyproject.toml", "myocardial_infarction_mortality/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["myocardial_infarction_mortality"]
force-sort-within-sections = true

